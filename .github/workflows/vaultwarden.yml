name: Vaultwarden Deployment/Update
on:
  push:
    branches:
      - main
    paths:
      - 'docker/vaultwarden-docker/**'
      - '.github/workflows/vaultwarden.yml'

jobs:
  update_vaultwarden:
    runs-on: self-hosted
    steps:
      - name: Run deployment script
        run: |
          ssh "$VAULTWARDEN_HOST@bitwarden" "bash ${{ vars.VAULTWARDEN_UPDATE_DIR }}"
