name: adguard_dns_update

on:
  push:
    branches:
      - '**'
    paths:
      - 'terraform/prod/services/AdGuard/adguard-dns/**'
  workflow_dispatch: {}

env:
  TF_DIR: "terraform/prod/services/AdGuard/adguard-dns"
  TF_VAR_adguard_admin_password: ${{ secrets.ADGUARD_ADMIN_PASSWORD }}

jobs:
  # Automatically opens a PR to main when a non-main branch is pushed
  open_pr:
    name: open_pull_request
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: node01-runner
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          if gh pr list --head "$BRANCH" --base main --state open --json number | grep -q '"number"'; then
            echo "PR already open for $BRANCH, skipping."
          else
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "AdGuard DNS update: $BRANCH" \
              --body "Auto-generated PR for changes under ${{ env.TF_DIR }}."
          fi

  # Manual-only: lets a user run terraform plan on demand
  terraform_plan:
    name: terraform_plan
    if: github.event_name == 'workflow_dispatch'
    runs-on: node01-runner
    container:
      image: hashicorp/terraform:latest
      volumes:
        - /var/local/terraform-state:/opt/terraform-state:rw
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Terraform Init
        run: |
          cd ${{ env.TF_DIR }}
          terraform init -input=false

      - name: Terraform Plan
        run: |
          cd ${{ env.TF_DIR }}
          terraform plan -input=false

  # Unchanged: apply only happens on merge to main
  terraform_apply:
    name: terraform_apply
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: node01-runner
    container:
      image: hashicorp/terraform:latest
      volumes:
        - /var/local/terraform-state:/opt/terraform-state:rw