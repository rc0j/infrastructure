name: terraform_firewall_update

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/prod/network/**'
      - '.github/workflows/orion-firewall.yml'

jobs:
  update_firewall_rules:
    name: update_firewall_rules
    runs-on: self-hosted
    container:
      image: hashicorp/terraform:latest
      volumes:
        - /var/local/terraform-state:/opt/terraform-state:rw

    env:
      TF_DIR: "terraform/prod/network"
      STATE_FILE: "/opt/terraform-state/firewall.tfstate"
      TF_VAR_proxmox_admin_password: ${{ secrets.PROXMOX_ADMIN_PASSWORD }}

    steps:
      # Note: updated to v4, as v7 does not exist for the checkout action
      - name: Checkout Code
        uses: actions/checkout@v7

      # Pull the last known state into the working dir so Terraform
      # knows what it already created. First run: no file yet, that's fine.
      - name: Restore Previous State
        run: |
          mkdir -p /opt/terraform-state
          if [ -f "${{ env.STATE_FILE }}" ]; then
            cp "${{ env.STATE_FILE }}" "${{ env.TF_DIR }}/terraform.tfstate"
            echo "Restored existing state file."
          else
            echo "No previous state file found, starting fresh."
          fi

      - name: Terraform Init
        run: |
          cd ${{ env.TF_DIR }}
          terraform init -input=false

      - name: Terraform Plan
        id: plan
        run: |
          cd ${{ env.TF_DIR }}
          terraform plan -out=tfplan -input=false

      # Only run the apply step if the workflow was triggered by a push to main
      - name: Terraform Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cd ${{ env.TF_DIR }}
          terraform apply -input=false tfplan

      # Persist the updated state back to the mounted volume so it
      # survives to the next run.
      - name: Save Updated State
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cp "${{ env.TF_DIR }}/terraform.tfstate" "${{ env.STATE_FILE }}"
          echo "State file saved to ${{ env.STATE_FILE }}"