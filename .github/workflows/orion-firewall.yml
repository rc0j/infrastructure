name: terraform_firewall_update

on:
  push:
    branches:
      - main
      - managed_firewall
    paths:
      - 'terraform/prod/network/**'
      - '.github/workflows/orion-firewall.yml'

jobs:
  terraform:
    name: Terraform Firewall
    runs-on: self-hosted

    container:
      image: hashicorp/terraform:latest
      volumes:
        - /var/local/terraform-state:/opt/terraform-state:rw

    env:
      TF_DIR: "terraform/prod/network"
      STATE_FILE: "/opt/terraform-state/firewall.tfstate"
      PROXMOX_ADMIN_PASSWORD: ${{ secrets.PROXMOX_ADMIN_PASSWORD }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Restore Previous State
        run: |
          mkdir -p /opt/terraform-state

          if [ -f "${STATE_FILE}" ]; then
            cp "${STATE_FILE}" "${TF_DIR}/terraform.tfstate"
            echo "Restored existing state file."
          else
            echo "No previous state file found, starting fresh."
          fi

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init -input=false

      - name: Terraform Plan
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform plan \
            -input=false \
            -out=tfplan \
            -var="proxmox_admin_password=${PROXMOX_ADMIN_PASSWORD}"

      - name: Terraform Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform apply \
            -input=false \
            tfplan

      - name: Save State File
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: ${{ env.TF_DIR }}
        run: |
          cp terraform.tfstate "${STATE_FILE}"