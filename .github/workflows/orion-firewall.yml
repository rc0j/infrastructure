name: terraform_firewall_update

on:
  push:
    branches:
      - main
      - managed_firewall
    paths:
      - 'terraform/prod/network/**'
      - '.github/workflows/orion-firewall.yml'

jobs:
  prepare_env:
    name: prepare_env
    runs-on: self-hosted
    container:
      image: hashicorp/terraform:latest
      volumes:
        - /var/local/terraform-state:/opt/terraform-state:rw

    env:
      TF_DIR: "terraform/prod/network"
      STATE_FILE: "/opt/terraform-state/firewall.tfstate"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Restore Previous State
        run: |
          mkdir -p /opt/terraform-state
          if [ -f "${{ env.STATE_FILE }}" ]; then
            cp "${{ env.STATE_FILE }}" "${{ env.TF_DIR }}/terraform.tfstate"
            echo "Restored existing state file."
          else
            echo "No previous state file found, starting fresh."
          fi
    
  terraform_init:
    name: terraform_init
    runs-on: self-hosted
    container:
      image: hashicorp/terraform:latest
      volumes:
        - /var/local/terraform-state:/opt/terraform-state:rw
    env:
      TF_DIR: "terraform/prod/network"
      STATE_FILE: "/opt/terraform-state/firewall.tfstate"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Terraform Init
        run: |
          cd ${{ env.TF_DIR }}
          terraform init -input=false
    
  terraform_plan:
    name: terraform_plan
    runs-on: self-hosted
    container:
      image: hashicorp/terraform:latest
      volumes:
        - /var/local/terraform-state:/opt/terraform-state:rw
    env:
      TF_DIR: "terraform/prod/network"
      STATE_FILE: "/opt/terraform-state/firewall.tfstate"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Terraform Plan
        id: plan
        run: |
          cd ${{ env.TF_DIR }}
          terraform plan -out=tfplan -input=false
    
  terraform_apply:
    name: terraform_apply
    needs: [prepare_env, terraform_init, terraform_plan]
    runs-on: self-hosted
    container:
      image: hashicorp/terraform:latest
      volumes:
        - /var/local/terraform-state:/opt/terraform-state:rw
    env:
      TF_DIR: "terraform/prod/network"
      STATE_FILE: "/opt/terraform-state/firewall.tfstate"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Terraform Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cd ${{ env.TF_DIR }}
          terraform apply -input=false tfplan
      - name: Save State File
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cd ${{ env.TF_DIR }}
          cp terraform.tfstate "${{ env.STATE_FILE }}"
