---
- name: Homelab
  hosts: all

  roles:
    # CORE:
    - role: ssh
      tags: ssh
    - role: bashrc
      tags: bashrc
    - role: swapfile
      tags: swapfile
    - role: update_motd
      tags: update_motd
    - role: centreon_monitoring
      tags: centreon_monitoring
    - role: bitwarden
      tags: bitwarden
    # OPTIONAL:
    - role: reboot
      tags: never, reboot
    - role: backup_proxmox
      tags: never, backup_proxmox
    # - role: syncthing
    #   tags: never, syncthing
    - role: minimal_packages
      tags: never,minimal_packages
